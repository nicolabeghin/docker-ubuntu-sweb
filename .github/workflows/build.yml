name: Build
on:
  schedule:
    - cron: "0 6 * * *"
  push:

jobs:
  build:
    strategy:
      matrix:
        os:
          [
            { version: 20.04, code: focal, latest: false },
            { version: 22.04, code: jammy, latest: false },
            { version: 24.04, code: noble, latest: true },
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set Current Date
        env:
          TZ: 'Europe/Rome'
        run: echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Build and Push
        if: ${{ matrix.os.latest == false }}
        uses: docker/build-push-action@v6
        with:
          build-args: TARGET_TAG=${{ matrix.os.code }}
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            quay.io/nicolabeghin/docker-ubuntu-sweb:${{ matrix.os.code }}
            quay.io/nicolabeghin/docker-ubuntu-sweb:${{ matrix.os.code }}-${{ env.CURRENT_DATE }}
            quay.io/nicolabeghin/docker-ubuntu-sweb:${{ matrix.os.version }}

      - name: Build and Push Latest
        if: ${{ matrix.os.latest == true }}
        uses: docker/build-push-action@v6
        with:
          build-args: TARGET_TAG=${{ matrix.os.code }}
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            quay.io/nicolabeghin/docker-ubuntu-sweb:${{ matrix.os.code }}
            quay.io/nicolabeghin/docker-ubuntu-sweb:${{ matrix.os.code }}-${{ env.CURRENT_DATE }}
            quay.io/nicolabeghin/docker-ubuntu-sweb:${{ matrix.os.version }}
            quay.io/nicolabeghin/docker-ubuntu-sweb:latest
